version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: sih_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sih_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sih_db
      - JWT_SECRET=sih_26188_fake_identity_screening_secret_key_sashastra_seema_bal
      - UPLOAD_DIRECTORY=/app/uploads
      - MAX_FILE_SIZE=5242880
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih_frontend_app
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
